name: secucheck
description: "SecuCheck — Device Risk Auditor. Scans your Android device for security risks and produces a scored audit report."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state management
  get: ^4.6.6

  # responsive layout scaling
  flutter_screenutil: ^5.9.3

  # typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # lint rules
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
